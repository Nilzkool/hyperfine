[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperfine"
version = "0.1.0"
description = "Hyperparameter search wrapper combining hyperopt (TPE/random search) with grid-search fine-tuning."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Neel Das" }]
dependencies = [
    "numpy",
    "hyperopt",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/Nilzkool/hyperfine"

[tool.setuptools.packages.find]
where = ["src"]
